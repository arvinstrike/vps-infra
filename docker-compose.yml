services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Caddy idles (ACME will fail) until DOMAIN resolves to this droplet — expected pre-domain.
      DOMAIN: ${DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 256M

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    # Loopback-only bind: reachable via SSH tunnel, never exposed to the internet.
    # ssh -L 3001:localhost:3001 arvin@<droplet-ip>  →  http://localhost:3001
    ports:
      - "127.0.0.1:3001:3001"   # TODO: remove after Caddy route exists
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy_data:
  caddy_config:
  uptime_kuma_data:

networks:
  infra:
    external: true
