services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Caddy idles (ACME will fail) until DOMAIN resolves to this droplet — expected pre-domain.
      DOMAIN: ${DOMAIN:-example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 256M

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    # No published ports — reached only via Caddy on the internal network.
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    # No published ports — internal `infra` network only, per hard rule in CLAUDE.md.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    # No published ports — internal `infra` network only, per hard rule in CLAUDE.md.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 1024M
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    # No published ports — internal `infra` network only, per hard rule in CLAUDE.md.
    # ponytail: --max-batch-tokens 2048 caps warmup allocation. Default 16384 tries to
    # alloc ~8GB for the attention MatMul during warmup and fails on this 8GB box.
    # Raise it (and the memory limit) if the droplet ever gets more RAM.
    command: --model-id ${TEI_MODEL:-BAAI/bge-m3} --auto-truncate --max-batch-tokens 2048
    volumes:
      - tei_data:/data
    networks:
      - infra                              
    deploy:
      resources:
        limits:
          memory: 4096M

  langfuse:
    image: langfuse/langfuse:2.84.1
    restart: unless-stopped
    # No published ports — reached via Caddy on the internal network.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: https://langfuse.${DOMAIN}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "true"
      # Instance is public — lock signups after the owner account is created.
      AUTH_DISABLE_SIGNUP: "true"
    networks:
      - infra
    deploy:
      resources:
        limits:
          memory: 1024M



volumes:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
  postgres_data:
  qdrant_data:
  tei_data:

networks:
  infra:
    external: true
